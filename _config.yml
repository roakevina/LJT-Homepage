  xing             : # Username
  youtube          : # Username
  zhihu            : # Username

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/ for social media previews
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false      #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "utterances", "giscus"
  disqus:
    shortname            :
  utterances:
    theme                : "github-light"
    issue_term           : "pathname"
  giscus:
    repo_id              :
    category_id          :
    category             :
    mapping              :
    strict               :
    reactions_enabled    :
    emit_metadata        :
    theme                :
script:
  - "/assets/js/vanilla-back-to-top.min.js"

# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               : &twitter "junteng88716710"
og_image                 : "/assets/images/1200x630_ share.png"
# For specifying social profiles
# - https://developers.google.com/structured-data/custom-schema.org/person
social:
  type                 : Person
  name                 : "Junteng Liu"
  url                  :
  email                : "jliugi@connect.ust.hk"
  github               : "https://github.com/Vicent0205"
  twitter              : "https://x.com/junteng88716710"

# Analytics
analytics:
  provider               : false # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          : # Replace with your own tracking ID. e.g. "UA-XXXXXX-XX"
    anonymize_ip         : false


